description: Tuhu (途虎养车) is a Chinese online-to-offline automotive services platform founded in
  2011 and headquartered in Shanghai. Through its app, website, and network of franchised and self-operated
  workshops it sells tires and provides car maintenance, repair, and related aftermarket services to
  consumers across China. Tuhu is publicly listed on the Hong Kong Stock Exchange (9690) and counts Qiming
  Venture Partners among its investors. This API Evangelist profile tracks the company; enrichment probes
  found no public developer API, open platform, or developer portal.
